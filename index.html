<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="container">
      <header class="page-header">
        <div>
          <h1>Expense Tracker</h1>
          <p>Manage your money, one transaction at a time.</p>
        </div>
      </header>

      <!-- Balance summary -->
      <section class="balance-card">
        <p class="summary-label">Your Total Balance</p>
        <h2 id="total-balance">ETB 0.00</h2>

        <div class="summary-details">
          <div>
            <p class="summary-label">Total Income</p>
            <p id="total-income" class="income-amount">ETB 0.00</p>
          </div>

          <div>
            <p class="summary-label">Total Expenses</p>
            <p id="total-expenses" class="expense-amount">ETB 0.00</p>
          </div>
        </div>
      </section>

      <!-- Add transaction form -->
      <section class="form-section">
        <h2>Add Transaction</h2>

        <form id="transaction-form">
          <div class="form-group">
            <label for="description">Description</label>
            <input
              type="text"
              id="description"
              name="description"
              placeholder="e.g. Groceries"
              required
            />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="amount">Amount (ETB)</label>
              <input
                type="number"
                id="amount"
                name="amount"
                placeholder="0.00"
                min="0.01"
                step="0.01"
                required
              />
            </div>

            <div class="form-group">
              <label for="type">Transaction Type</label>
              <select id="type" name="type" required>
                <option value="">Select type</option>
                <option value="income">Income</option>
                <option value="expense">Expense</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="category">Category</label>
            <select id="category" name="category" required>
              <option value="">Select category</option>
              <option value="Salary">Salary</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Education">Education</option>
              <option value="Shopping">Shopping</option>
              <option value="Bills">Bills</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <button type="submit" id="add-transaction-btn">
            Add Transaction
          </button>
        </form>
      </section>

      <!-- Transaction history -->
      <section class="history-section">
        <div class="history-header">
          <h2>Transaction History</h2>
          <button type="button" id="clear-history-btn" class="secondary-btn">
            Clear All
          </button>
        </div>

        <p id="empty-message" class="empty-message">
          No transactions yet. Add your first transaction!
        </p>

        <ul id="transaction-list" class="transaction-list">
          <!-- JavaScript will create transaction items here. -->
        </ul>
      </section>
    </main>
  </body>
</html>
